<!doctype html>
<html lang="en">
  <head>
     <meta charset="UTF-8" />
     <meta name="viewport" content="width=device-width, initial-scale=1.0" />

     <title>DriveX — Premium Car Rental</title>
     <meta
       name="description"
       content="DriveX — premium car rental. Luxury, SUV and electric vehicles delivered where you are, when you need them."
     />
     <meta name="theme-color" content="#f0a500" />

     <!-- ============ POLICES ============ -->
     <!-- Plus Jakarta Sans : police geometrique moderne, tres lisible,
          utilisee par de nombreuses marques premium/tech. On charge
          quelques graisses (400 a 800) pour couvrir titres et texte.
          preconnect accelere la negociation TLS avec Google Fonts. -->
     <link rel="preconnect" href="https://fonts.googleapis.com" />
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
     <link
       href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
       rel="stylesheet"
     />
     <!-- Sora pour les grands titres : formes geometriques et affirmées. -->
     <link
       href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&display=swap"
       rel="stylesheet"
     />

     <!-- ============ FAVICON / ICONES ============ -->
     <!-- favicon.ico en premier : les navigateurs le prennent en priorite -->
     <link rel="icon" href="/brand/favicon.ico" sizes="any" />
     <link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png" />
     <link rel="icon" type="image/png" sizes="16x16" href="/brand/icon-16.png" />
     <!-- iOS : pas de coins arrondis, le systeme les applique -->
     <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
     <link rel="manifest" href="/site.webmanifest" />

     <!-- ============ PARTAGE SOCIAL ============ -->
     <meta property="og:type" content="website" />
     <meta property="og:title" content="DriveX — Premium Car Rental" />
     <meta
       property="og:description"
       content="Drive the car you were born to drive. Luxury, SUV and electric vehicles, delivered to your door."
     />
     <meta property="og:image" content="/brand/og-image.png" />
     <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
